# A-Share Quantitative Metric Semantic Layer (子项目 ❸)
#
# 统一量化指标定义，避免"同名异义"。每个指标含：
#   name, formula, description, unit, dimensions, source_table
#
# 消费方：
#   - chat-database agent：通过 Python 编译器把 (metric, dimensions) → SQL
#   - 未来仪表板：直接读 SQL 或调 metrics.compile()
#   - Meta-Agent (❻)：基于统一口径查询历史实验
#
# 技术选择记录（决策 M-❸-1）：
#   不用 dbt Semantic Layer（需 dbt Cloud 付费 / MetricFlow 对 DuckDB 兼容差）
#   不用 Cube.dev（需独立部署，与"单仓库最小化服务"原则冲突）
#   采用轻量 YAML catalog + Python 编译器，所有逻辑在仓库内，零额外服务。

metrics:
  # ========== 因子评价指标（5 个） ==========
  - name: ic_1d
    description: 次日信息系数（因子值与 T+1 收益的 Spearman 相关）
    formula: corr(factor_value, lead(daily_return, 1)) OVER (PARTITION BY trade_date)
    unit: dimensionless (-1 ~ 1)
    category: factor_evaluation
    source_table: dws_factor_daily
    dimensions: [universe, period]

  - name: ic_20d
    description: 20 日信息系数（因子值与 T+20 收益的 Spearman 相关）
    formula: corr(factor_value, lead(daily_return, 20)) OVER (PARTITION BY trade_date)
    unit: dimensionless (-1 ~ 1)
    category: factor_evaluation
    source_table: dws_factor_daily
    dimensions: [universe, period]

  - name: icir
    description: 信息系数的信息比 = mean(IC) / stddev(IC)，衡量因子稳定性
    formula: avg(ic) / nullif(stddev(ic), 0)
    unit: dimensionless
    category: factor_evaluation
    source_table: ods_factor_experiments
    dimensions: [universe, period, factor_name]

  - name: turnover_monthly
    description: 月换手率 = 月度持仓变动占平均持仓的比例
    formula: sum(abs(weight_t - weight_t_minus_1)) / 2 / avg(total_weight)
    unit: ratio (0 ~ 1)
    category: factor_evaluation
    source_table: ods_factor_experiments
    dimensions: [universe, factor_name]

  - name: ir_rank
    description: 因子 ICIR 在同 universe 内的百分位排名
    formula: percent_rank() OVER (PARTITION BY universe ORDER BY icir DESC)
    unit: percentile (0 ~ 1)
    category: factor_evaluation
    source_table: ods_factor_experiments
    dimensions: [universe, period]

  # ========== 策略/回测评价指标（5 个） ==========
  - name: sharpe_annualized
    description: 年化夏普比率 = mean(daily_return) / stddev(daily_return) * sqrt(252)
    formula: avg(daily_return) / nullif(stddev(daily_return), 0) * sqrt(252)
    unit: dimensionless
    category: strategy_evaluation
    source_table: ods_backtest_runs
    dimensions: [strategy_name, start_date, end_date]

  - name: max_drawdown
    description: 最大回撤 = min((nav - running_max(nav)) / running_max(nav))
    formula: min((nav - max(nav) OVER (ORDER BY trade_date)) / max(nav) OVER (ORDER BY trade_date))
    unit: ratio (negative, e.g. -0.25 = -25%)
    category: strategy_evaluation
    source_table: ods_backtest_runs
    dimensions: [strategy_name]

  - name: annual_return
    description: 年化收益率 = (final_nav / initial_nav) ^ (252 / N_days) - 1
    formula: power(max(nav) / min(nav), 252.0 / count(*)) - 1
    unit: ratio (e.g. 0.18 = 18%)
    category: strategy_evaluation
    source_table: ods_backtest_runs
    dimensions: [strategy_name, start_date, end_date]

  - name: win_rate
    description: 胜率 = 盈利交易日数 / 总交易日数
    formula: sum(CASE WHEN daily_return > 0 THEN 1 ELSE 0 END) * 1.0 / count(*)
    unit: ratio (0 ~ 1)
    category: strategy_evaluation
    source_table: dwd_equity_daily
    dimensions: [strategy_name, period]

  - name: calmar_ratio
    description: Calmar 比率 = 年化收益率 / |最大回撤|
    formula: annual_return / nullif(abs(max_drawdown), 0)
    unit: dimensionless
    category: strategy_evaluation
    source_table: ods_backtest_runs
    dimensions: [strategy_name]

# ========== 维度词典 ==========
dimensions:
  - name: universe
    description: 股票池（csi300 / csi500 / csi1000 / all_a_share）
    values: [csi300, csi500, csi1000, all_a_share]
  - name: period
    description: 回测/评估时间窗口
    values: ["2018-01-01~2024-12-31", "2020-01-01~2024-12-31", "rolling_3y"]
  - name: factor_name
    description: 因子名（如 momentum_20d / value_pe）
    source: ods_factor_experiments.name
  - name: strategy_name
    description: 策略/回测运行名
    source: ods_backtest_runs.name
  - name: start_date
    description: 回测起始日
    source: ods_backtest_runs.start_date
  - name: end_date
    description: 回测结束日
    source: ods_backtest_runs.end_date
