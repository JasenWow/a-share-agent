[project]
name = "aquan-internal-store-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
internal-store-mcp = "server:main"

[tool.setuptools.packages.find]
exclude = ["test_*"]
