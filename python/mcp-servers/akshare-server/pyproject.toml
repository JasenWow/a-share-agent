[project]
name = "aquan-akshare-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.14",
    "mcp>=1.0",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
akshare-mcp = "server:main"

[tool.setuptools.packages.find]
exclude = ["test_server"]
