[project]
name = "aquan-python"
version = "0.1.0"
description = "Python side of aquan: MCP servers, ETL, metrics, dbt"
readme = "README.md"
requires-python = ">=3.10,<3.13"
# Phase 1: only the minimal deps that the aquan public layer actually imports.
# Heavy deps (pyqlib, mlflow, jupyterlab, dbt-duckdb, akshare, tushare, etc.)
# are added back incrementally in Phase 2 (mcp-servers), Phase 3 (etl),
# Phase 4 (notebooks/dbt). Keeping Phase 1 lean makes the gate fast.
dependencies = [
    "pyarrow>=14.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    # Phase 3: ETL needs duckdb for catalog/jobs state.
    "duckdb>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the aquan/ public layer + the etl/ domain package + notebooks helpers.
# dbt/ is a SQL project (not a Python package), tests/ is test-only — neither
# ships in the wheel.
packages = ["aquan", "etl", "notebooks"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

# Phase 2: 4 MCP servers added as workspace members + sources.
[tool.uv.sources]
aquan-akshare-server = { workspace = true }
aquan-internal-store-server = { workspace = true }
aquan-tushare-server = { workspace = true }
aquan-qlib-server = { workspace = true }

[tool.uv.workspace]
members = [
    "mcp-servers/akshare-server",
    "mcp-servers/tushare-server",
    "mcp-servers/internal-store",
    "mcp-servers/qlib-server",
]

[tool.uv]
environments = ["sys_platform != 'win32'"]

[tool.ruff]
line-length = 120
# Skip linting/formatting Jupyter notebooks — they're exploratory code with
# different conventions. Add `extend-include = ["*.ipynb"]` later if/when
# we want notebook linting.
extend-exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that need MCP servers running",
    "e2e: marks end-to-end tests with fixture data",
]
testpaths = ["aquan", "tests"]
