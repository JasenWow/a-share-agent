[project]
name = "a-share-agents"
version = "0.1.0"
description = "A-share quantitative analysis agent system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "akshare>=1.14",
    "tushare>=1.4",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "plotly>=5.18",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "jupyterlab>=4.0",
    "nbconvert>=7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.uv.sources]
akshare-mcp-server = { workspace = true }
internal-store-mcp-server = { workspace = true }
prediction-store-mcp-server = { workspace = true }
tushare-mcp-server = { workspace = true }

[tool.uv.workspace]
members = [
    "mcp-servers/akshare-server",
    "mcp-servers/internal-store",
    "mcp-servers/prediction-store",
    "mcp-servers/tushare-server",
]

[tool.ruff]
line-length = 120
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that need MCP servers running",
    "e2e: marks end-to-end tests with fixture data",
]
