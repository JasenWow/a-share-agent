<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backtest Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.11/dayjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f1117;
            --card: #1a1d28;
            --border: #2a2d3a;
            --text: #e1e4ed;
            --text-muted: #8b8fa3;
            --accent: #5b8ff9;
            --green: #5ad8a6;
            --red: #f6544e;
            --orange: #f6bd16;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* Header */
        .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header .meta { color: var(--text-muted); font-size: 13px; margin-left: auto; display: flex; gap: 16px; }
        .header .meta span { display: flex; align-items: center; gap: 4px; }

        /* Tabs */
        .tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; }
        .tab { padding: 10px 20px; cursor: pointer; color: var(--text-muted); font-size: 14px; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        /* Main */
        .main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
        .panel { display: none; }
        .panel.active { display: block; }

        /* Metric Cards */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .metric-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
        .metric-card .label { color: var(--text-muted); font-size: 12px; margin-bottom: 4px; }
        .metric-card .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .metric-card .value.positive { color: var(--green); }
        .metric-card .value.negative { color: var(--red); }

        /* Chart Container */
        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
        .chart-box.full { grid-column: 1 / -1; }
        .chart-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
        .chart-container { width: 100%; height: 360px; }

        /* Table */
        .table-wrapper { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .table-filters { padding: 12px 16px; display: flex; gap: 12px; border-bottom: 1px solid var(--border); }
        .table-filters select, .table-filters input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 4px; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: var(--bg); color: var(--text-muted); font-weight: 600; text-align: left; padding: 10px 16px; position: sticky; top: 0; }
        td { padding: 10px 16px; border-top: 1px solid var(--border); }
        tr:hover td { background: rgba(91,143,249,0.05); }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .tag-buy { background: rgba(90,216,166,0.15); color: var(--green); }
        .tag-sell { background: rgba(246,84,78,0.15); color: var(--red); }
        .positive { color: var(--green); }
        .negative { color: var(--red); }
        .table-scroll { max-height: 500px; overflow-y: auto; }

        /* Session Selector */
        .session-selector { padding: 16px; }
        .session-list { display: flex; flex-direction: column; gap: 8px; max-width: 600px; margin: 40px auto; }
        .session-item { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; cursor: pointer; transition: border-color 0.2s; }
        .session-item:hover { border-color: var(--accent); }
        .session-item .name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .session-item .detail { color: var(--text-muted); font-size: 13px; }
        .session-item .status { float: right; }
        .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .status-completed { background: rgba(90,216,166,0.15); color: var(--green); }
        .status-running { background: rgba(91,143,249,0.15); color: var(--accent); }
        .status-failed { background: rgba(246,84,78,0.15); color: var(--red); }

        .empty-state { text-align: center; color: var(--text-muted); padding: 60px; font-size: 15px; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <div class="header">
            <h1 id="session-name">Backtest Dashboard</h1>
            <div class="meta" id="session-meta"></div>
        </div>

        <!-- Tabs -->
        <div class="tabs" id="tabs" style="display:none;">
            <div class="tab active" data-panel="equity">净值曲线</div>
            <div class="tab" data-panel="performance">绩效指标</div>
            <div class="tab" data-panel="trades">交易记录</div>
            <div class="tab" data-panel="positions">持仓分析</div>
        </div>

        <!-- Session Selector Panel -->
        <div class="main" id="session-panel">
            <div class="session-selector">
                <div id="session-list" class="session-list"></div>
            </div>
        </div>

        <!-- Equity Curve Panel -->
        <div class="main panel" id="panel-equity">
            <div class="chart-box full" style="margin-bottom:20px;">
                <div class="chart-title">净值曲线</div>
                <div id="chart-equity" class="chart-container"></div>
            </div>
            <div class="chart-box full">
                <div class="chart-title">回撤</div>
                <div id="chart-drawdown" class="chart-container" style="height:200px;"></div>
            </div>
        </div>

        <!-- Performance Panel -->
        <div class="main panel" id="panel-performance">
            <div id="perf-metrics" class="metrics-grid"></div>
            <div class="chart-row">
                <div class="chart-box">
                    <div class="chart-title">成本分解</div>
                    <div id="chart-cost" class="chart-container" style="height:300px;"></div>
                </div>
                <div class="chart-box">
                    <div class="chart-title">月度收益</div>
                    <div id="chart-monthly" class="chart-container" style="height:300px;"></div>
                </div>
            </div>
        </div>

        <!-- Trades Panel -->
        <div class="main panel" id="panel-trades">
            <div class="table-wrapper">
                <div class="table-filters">
                    <select id="filter-direction"><option value="">全部方向</option><option value="buy">买入</option><option value="sell">卖出</option></select>
                    <input id="filter-stock" type="text" placeholder="股票代码筛选">
                </div>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>股票</th>
                                <th>方向</th>
                                <th>数量</th>
                                <th>价格</th>
                                <th>金额</th>
                                <th>佣金</th>
                                <th>印花税</th>
                                <th>滑点</th>
                                <th>总成本</th>
                                <th>盈亏</th>
                            </tr>
                        </thead>
                        <tbody id="trades-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Positions Panel -->
        <div class="main panel" id="panel-positions">
            <div class="chart-row" style="margin-bottom:20px;">
                <div class="chart-box">
                    <div class="chart-title">持仓权重分布</div>
                    <div id="chart-weight" class="chart-container" style="height:350px;"></div>
                </div>
                <div class="chart-box">
                    <div class="chart-title">持仓盈亏</div>
                    <div id="chart-pnl" class="chart-container" style="height:350px;"></div>
                </div>
            </div>
            <div class="table-wrapper">
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr><th>日期</th><th>股票</th><th>数量</th><th>成本</th><th>市值</th><th>权重</th><th>盈亏</th><th>盈亏%</th></tr>
                        </thead>
                        <tbody id="positions-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
