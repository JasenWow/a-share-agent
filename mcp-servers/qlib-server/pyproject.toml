[project]
name = "qlib-mcp-server"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyqlib>=0.9",
    "mcp>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
qlib-mcp = "server:main"

[tool.setuptools.packages.find]
exclude = ["test_*"]
